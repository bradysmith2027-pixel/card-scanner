[pytest]
# Marker separation (Q1): unit tests are fast, isolated, and never hit the
# network / DB / OpenAI. The "live" scripts (tests/live_*_check.py) are NOT
# collected by pytest (they aren't test_*.py) and are run manually.
#
# Run only the fast suite:   pytest -m unit
# Run everything collected:  pytest
markers =
    unit: fast, isolated test with all external services mocked (no network/DB/OpenAI spend).
    live: integration test that hits real Supabase/OpenAI (the tests/live_*_check.py scripts; run manually).
